# The background worker: overdue reminders every hour (and reconciliation with BILLING_PROVIDER=stripe). Several
# replicas are safe (claims use SKIP LOCKED and a lease); one is enough. On SIGTERM it finishes the current step and
# exits 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tally, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tally, app.kubernetes.io/component: worker }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: tally-worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: tally-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: tally-secrets, key: database-url } }
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: tally-secrets, key: stripe-secret-key, optional: true } }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: tally-secrets, key: stripe-webhook-secret, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
