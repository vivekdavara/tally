name: CI

on:
  push:
  pull_request:

# Postgres 14 in a service container, trusting connections, so no database password exists anywhere.
# scripts/db-setup.sh then creates tally_owner, tally_app and the databases, exactly as on a laptop.
env:
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: postgres
  NEXT_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  check:
    # Prisma 7 and Vitest 5 support Node 22.12+ and 24; test both.
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: scripts/db-setup.sh
      - run: npm run typecheck
      - run: npm run lint
      # Integration tests migrate tally_test themselves (tests/global-setup.ts).
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: scripts/db-setup.sh tally_e2e
      - run: npm run build
      - run: google-chrome --version
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
