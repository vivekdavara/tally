name: CI

on:
  push:
  pull_request:

# Postgres 14 in a service container, trusting connections, so no database password exists anywhere.
# scripts/db-setup.sh then creates tally_owner, tally_app and the databases, exactly as on a laptop.
env:
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: postgres
  NEXT_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  check:
    # Prisma 7 and Vitest 5 support Node 22.12+ and 24; test both.
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: scripts/db-setup.sh
      - run: npm run typecheck
      - run: npm run lint
      # Integration tests migrate tally_test themselves (tests/global-setup.ts). The role-check tests need a
      # superuser connection.
      - run: npm test
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/tally_test
      - run: npm run build
      # The measurement scripts, small, so they keep working (each count they take is checked).
      - name: benchmark smoke run
        env:
          BENCH_ADMIN_URL: postgresql://postgres@localhost:5432/tally_bench
          BENCH_TENANTS: '10'
          BENCH_CUSTOMERS: '100'
          BENCH_ITERATIONS: '100'
          BENCH_ROUNDS: '5'
          BENCH_OUT: ${{ runner.temp }}/bench-tenant.json
        run: |
          scripts/db-setup.sh tally_bench
          npm run bench
          npm run bench:signin
          BENCH_FINALIZATIONS=50 BENCH_CONCURRENCY=1,4 BENCH_OUT=$RUNNER_TEMP/bench-finalize.json npm run bench:finalize
          BENCH_EVENTS=50 BENCH_CONCURRENCY=1,4 BENCH_OUT=$RUNNER_TEMP/bench-webhook.json npm run bench:webhook
          BENCH_INVOICES=100 BENCH_RECHECKS=100 BENCH_OUT=$RUNNER_TEMP/bench-reminders.json npm run bench:reminders
          BENCH_STARTS=1 BENCH_REQUESTS=10 BENCH_DATABASE_URL=postgresql://tally_app@localhost:5432/tally_test npm run bench:startup

  e2e:
    name: e2e (chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: scripts/db-setup.sh tally_e2e
      - run: npm run build
      - run: google-chrome --version
      - run: npm run e2e
        env:
          E2E_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/tally_e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The deployment artifacts (Dockerfile, DESIGN.md "Deployment"): build the three images, run the release step, start
  # the web image and run the whole e2e suite against it, then check the worker image and how both stop.
  image:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      APP_URL: postgresql://tally_app@localhost:5432/tally_e2e
      OWNER_URL: postgresql://tally_owner@localhost:5432/tally_e2e
    steps:
      - uses: actions/checkout@v7
      - name: build the web, worker and migrate images
        run: |
          docker build --target migrate -t tally-migrate .
          docker build --target worker -t tally-worker .
          docker build -t tally-web .
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^tally-'
      - name: the images run as an unprivileged user and carry no .env file
        run: |
          for image in tally-web tally-worker tally-migrate; do
            user=$(docker inspect -f '{{.Config.User}}' "$image")
            echo "$image runs as $user"
            test "$user" = node
          done
          # As root, so find can read every directory; its exit status (unreadable /proc entries) doesn't matter.
          for image in tally-web tally-worker tally-migrate; do
            found=$(docker run --rm --user root --entrypoint sh "$image" -c "find / -xdev -name '.env*' -not -path '*/node_modules/*' 2>/dev/null; true")
            echo "env files in $image: ${found:-none}"
            test -z "$found"
          done
      - run: scripts/db-setup.sh tally_e2e
      - name: before the release step, the web image refuses to start
        run: |
          set +e
          timeout 60 docker run --rm --network host -e DATABASE_URL="$APP_URL" -e AUTH_SECRET="$(openssl rand -base64 32)" -e PORT=8199 tally-web > early.log 2>&1
          status=$?
          set -e
          cat early.log
          test "$status" -eq 1
      - name: the release step (migrations, as tally_owner)
        run: docker run --rm --network host -e MIGRATE_DATABASE_URL="$OWNER_URL" tally-migrate
      - name: the web image refuses the owner role
        run: |
          set +e
          timeout 60 docker run --rm --network host -e DATABASE_URL="$OWNER_URL" -e AUTH_SECRET="$(openssl rand -base64 32)" -e PORT=8199 tally-web > owner.log 2>&1
          status=$?
          set -e
          tail -c 600 owner.log
          test "$status" -eq 1
          grep -q "refusing to serve" owner.log
      # Before the main web container starts: with --network host, a health check stuck on 8117 would otherwise reach
      # that container and pass (review round 2 of day 5).
      - name: the health check follows PORT
        run: |
          if curl -s -o /dev/null http://localhost:8117/; then echo "something already listens on 8117"; exit 1; fi
          docker run -d --name web2 --network host -e PORT=8119 -e DATABASE_URL="$APP_URL" -e AUTH_SECRET="$(openssl rand -base64 32)" tally-web
          for i in $(seq 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web2)
            if [ "$status" = healthy ]; then echo "healthy on 8119 after about $i s"; break; fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web2)" = healthy
          curl -fsS http://localhost:8119/api/health
          docker rm -f web2
      - name: start the web image, healthy
        run: |
          secret="whsec_e2e_$(openssl rand -hex 24)"
          echo "E2E_STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          docker run -d --name web --network host -e DATABASE_URL="$APP_URL" -e AUTH_SECRET="$(openssl rand -base64 32)" \
            -e AUTH_TRUST_HOST=true -e BILLING_PROVIDER=mock -e STRIPE_WEBHOOK_SECRET="$secret" tally-web
          for i in $(seq 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            if [ "$status" = healthy ]; then echo "healthy after about $i s"; break; fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy
          curl -fsS http://localhost:8117/api/health
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the e2e suite against the web container
        run: npm run e2e
        env:
          E2E_EXTERNAL_SERVER: '1'
          E2E_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/tally_e2e
      - name: the worker image runs a pass, then stops on SIGTERM with exit 0
        run: |
          # No pipe: under GitHub's default `bash -e` (no pipefail) a pipe would hide the worker's exit code (review
          # round 2 of day 5). A failed pass exits 1 and fails the step here.
          docker run --rm --network host -e DATABASE_URL="$APP_URL" tally-worker node dist/worker.mjs --once > once.log 2>&1 || { cat once.log; exit 1; }
          cat once.log
          grep -q '"job":"reminders"' once.log
          grep -q '"worker":"stopped"' once.log
          docker run -d --name worker --network host -e DATABASE_URL="$APP_URL" tally-worker
          for i in $(seq 30); do docker logs worker 2>&1 | grep -q '"job":"reminders"' && break; sleep 1; done
          start=$(date +%s.%N)
          docker stop worker
          end=$(date +%s.%N)
          docker logs worker
          code=$(docker inspect -f '{{.State.ExitCode}}' worker)
          echo "docker stop worker: $(awk "BEGIN { printf \"%.2f\", $end - $start }") s, exit code $code"
          test "$code" = 0
      - name: docker stop drains the web server (SIGTERM handled, not killed after 10 s)
        run: |
          start=$(date +%s.%N)
          docker stop web
          end=$(date +%s.%N)
          code=$(docker inspect -f '{{.State.ExitCode}}' web)
          echo "docker stop web: $(awk "BEGIN { printf \"%.2f\", $end - $start }") s, exit code $code"
          test "$code" = 143
      - name: container logs
        if: failure()
        run: |
          docker logs web || true
          docker logs web2 || true
          docker logs worker || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-image
          path: test-results/
          retention-days: 7

  # compose.yaml, the whole process model on one machine: Postgres, the release step, web and worker.
  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up
        run: |
          # Every compose command interpolates the file, so the secret goes into the job's environment.
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          AUTH_SECRET=unused-for-the-build docker compose build
      - name: the release step completes, then the web server is healthy
        run: |
          docker compose up -d
          for i in $(seq 120); do
            if curl -fsS http://localhost:8117/api/health; then echo; echo "healthy after about $i s"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8117/api/health
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")" = 0
          curl -fsS -o /dev/null http://localhost:8117/signup
          docker compose ps -a
      - name: a worker pass
        run: |
          docker compose run --rm --no-deps worker node dist/worker.mjs --once > once.log 2>&1 || { cat once.log; exit 1; }
          cat once.log
          grep -q '"job":"reminders"' once.log
      - name: compose logs
        if: always()
        run: docker compose logs --no-color | tail -n 200
      - name: docker compose down
        if: always()
        run: docker compose down -v


  # deploy/k8s on a throwaway kind cluster: Postgres (deploy/ci), the secrets, the migration Job, then web and worker.
  # kind and its node image pinned as in the Canary project.
  kubernetes:
    name: kubernetes (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          sudo install kind /usr/local/bin/kind
          kubectl version --client
      - name: images
        run: |
          docker build --target migrate -t tally-migrate:1.0.0 .
          docker build --target worker -t tally-worker:1.0.0 .
          docker build -t tally-web:1.0.0 .
      - name: cluster
        run: |
          kind create cluster --name tally --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 2m
          kind load docker-image tally-migrate:1.0.0 tally-worker:1.0.0 tally-web:1.0.0 --name tally
          kubectl create namespace tally
          kubectl config set-context --current --namespace tally
      - name: Postgres and the secrets
        run: |
          kubectl create configmap tally-db-setup --from-file=db-setup.sh=scripts/db-setup.sh
          kubectl apply -f deploy/ci/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl create secret generic tally-secrets \
            --from-literal=database-url=postgresql://tally_app@postgres:5432/tally \
            --from-literal=migrate-database-url=postgresql://tally_owner@postgres:5432/tally \
            --from-literal=auth-secret="$(openssl rand -base64 32)"
      - name: the release step, as a Job
        run: |
          kubectl apply -f deploy/k8s/config.yaml -f deploy/k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/tally-migrate --timeout=240s
          kubectl logs job/tally-migrate | tail -n 3
      - name: web and worker roll out (web ready means /api/health answered 200)
        run: |
          kubectl apply -f deploy/k8s/web.yaml -f deploy/k8s/worker.yaml
          kubectl rollout status deployment/tally-web --timeout=180s
          kubectl rollout status deployment/tally-worker --timeout=180s
      - name: the web server through its Service, and a worker pass
        run: |
          kubectl port-forward service/tally-web 18117:80 > port-forward.log 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:18117/api/health && break; sleep 1; done
          echo
          curl -fsS -o /dev/null -w "/signin %{http_code}\n" http://127.0.0.1:18117/signin
          kill %1
          for i in $(seq 30); do kubectl logs deployment/tally-worker > worker.log; grep -q '"job":"reminders"' worker.log && break; sleep 1; done
          cat worker.log
          grep -q '"job":"reminders"' worker.log
      - name: Kubernetes replaces the image's HOSTNAME (why web.yaml sets it)
        run: |
          kubectl run hostname-probe --image=tally-web:1.0.0 --image-pull-policy=IfNotPresent --restart=Never \
            --command -- node -e 'console.log("HOSTNAME=" + process.env.HOSTNAME)'
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/hostname-probe --timeout=120s
          kubectl logs pod/hostname-probe | tee hostname.log
          # Not `! grep`: bash -e doesn't stop on a negated command, so that line could never fail the step.
          if grep -qx 'HOSTNAME=0.0.0.0' hostname.log; then echo "the image's HOSTNAME survived"; exit 1; fi
          grep -q '^HOSTNAME=hostname-probe' hostname.log
          kubectl exec deployment/tally-web -- node -e 'console.log("web HOSTNAME=" + process.env.HOSTNAME)'
      - name: a rolling restart replaces the web pod without going unready
        run: |
          kubectl rollout restart deployment/tally-web
          kubectl rollout status deployment/tally-web --timeout=180s
          kubectl get pods -o wide
      - name: diagnostics
        if: failure()
        run: |
          kubectl get all,events --sort-by=.metadata.creationTimestamp || true
          kubectl describe pods || true
          kubectl logs deployment/tally-web --all-containers || true
          kubectl logs deployment/tally-worker || true
          kubectl logs job/tally-migrate || true
          kubectl logs deployment/postgres || true
